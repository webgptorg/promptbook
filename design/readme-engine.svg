<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Your controls. Your engine. Your files.</title>
  <desc id="desc">The dashboard and chat control an independent engine on your computer or server. The engine coordinates agents and tasks in a Git-backed project, using your selected models and tools. Closing a control interface leaves the engine running.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f6f8ff"/><stop offset="1" stop-color="#edf0fa"/></linearGradient>
    <linearGradient id="engine" x2="0.7" y2="1"><stop stop-color="#191959"/><stop offset="1" stop-color="#000080"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c6cbe0"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#000080" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1000" height="480" rx="24" fill="url(#paper)"/>
  <rect x="20" y="20" width="960" height="440" rx="18" fill="url(#grid)" opacity=".55"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="64" fill="#111827" font-size="22" font-weight="700">Your controls</text>
    <text x="478" y="64" fill="#111827" font-size="22" font-weight="700">Your machine</text>
    <g transform="translate(78 108)">
      <rect x="4" y="7" width="248" height="183" rx="14" fill="#d9deee"/>
      <rect width="248" height="183" rx="14" fill="#fff" stroke="#bfc7df" stroke-width="2"/>
      <path d="M0 35H248" stroke="#dbe0ed"/>
      <circle cx="18" cy="17" r="4" fill="#c8cfe0"/><circle cx="33" cy="17" r="4" fill="#c8cfe0"/><circle cx="48" cy="17" r="4" fill="#c8cfe0"/>
      <rect x="20" y="54" width="80" height="48" rx="8" fill="#ededfb"/>
      <path d="M37 79l8 8 17-20" stroke="#000080" stroke-width="3" fill="none"/>
      <rect x="113" y="56" width="110" height="8" rx="4" fill="#cdd3e3"/>
      <rect x="113" y="75" width="82" height="8" rx="4" fill="#e3e6ef"/>
      <rect x="20" y="116" width="202" height="8" rx="4" fill="#e3e6ef"/>
      <rect x="20" y="135" width="166" height="8" rx="4" fill="#e3e6ef"/>
      <text x="124" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#27304a">Dashboard · Chat</text>
      <path d="M84 185v22m81-22v22M59 208h132" stroke="#b8c2da" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M351 197H444" stroke="#000080" stroke-width="2.5" stroke-dasharray="6 8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <g transform="translate(478 108)">
      <rect x="6" y="8" width="444" height="228" rx="21" fill="#d0d5eb"/>
      <rect width="444" height="228" rx="21" fill="url(#engine)"/>
      <text x="24" y="40" fill="#fff" font-size="25" font-weight="700">Promptbook engine</text>
      <circle cx="413" cy="32" r="6" fill="#a8c8ff"/>
      <g fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2">
        <rect x="24" y="63" width="116" height="76" rx="10"/>
        <rect x="164" y="63" width="116" height="76" rx="10"/>
        <rect x="304" y="63" width="116" height="76" rx="10"/>
      </g>
      <g stroke="#c5ccff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="82" cy="86" r="7"/><path d="M69 105v-2a13 13 0 0126 0v2"/>
        <path d="M211 80h23v25h-23zM216 88h13m-13 7h9"/>
        <circle cx="355" cy="83" r="3"/><circle cx="370" cy="89" r="3"/><circle cx="355" cy="105" r="3"/><path d="M355 86v16m0-5c0-6 15 0 15-5"/>
        <path d="M144 101h14m126 0h14"/>
      </g>
      <g text-anchor="middle" fill="#fff" font-size="14" font-weight="700"><text x="82" y="126">Agents</text><text x="222" y="126">Tasks</text><text x="362" y="126">Git history</text></g>
      <path d="M26 168h391" stroke="#fff" stroke-opacity=".2"/>
      <path d="M37 190a10 10 0 111 16m-5-21 5 5-6 3" stroke="#bcc8ff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="59" y="201" fill="#e3e7ff" font-size="15">Work continues between visits</text>
    </g>
    <path d="M699 348v35" stroke="#000080" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="478" y="394" width="444" height="48" rx="12" fill="#fff" stroke="#c5cde3"/>
    <text x="700" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#000080">Your choice of models &amp; tools</text>
    <text x="78" y="383" fill="#4e5871" font-size="17">Close the dashboard</text>
    <text x="78" y="411" fill="#111827" font-size="19" font-weight="700">The engine keeps working</text>
  </g>
</svg>
