name: Publish ptbk
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match package.json)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-ptbk-publish
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'webgptorg/promptbook'
    uses: ./.github/workflows/check.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  publish:
    if: github.repository == 'webgptorg/promptbook'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Validate release tag and package version
        run: npm run release:validate
      - name: Publish the single ptbk package
        run: npm run release:publish -- --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  windows-installer:
    # The matching Windows installer is an additional output of the same release; npm publication stays separate. A
    # missing, corrupt or mismatched installer makes the release incomplete (this job fails) without republishing npm.
    if: github.repository == 'webgptorg/promptbook'
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the release version
        shell: pwsh
        run: |
          node scripts/validate-release.mjs $env:RELEASE_TAG
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $numeric = ($version -replace '-.*$', '') + '.' + (($version -replace '^[^-]*-?', '') -replace '\D', '' | ForEach-Object { if ($_) { $_ } else { '0' } })
          "PTBK_VERSION=$version" >> $env:GITHUB_ENV
          "PTBK_NUMERIC_VERSION=$numeric" >> $env:GITHUB_ENV
      - name: Build the installer from the release tag
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'The Inno Setup compiler (ISCC.exe) was not found after its installation.' }
          & $iscc.FullName "/DVersion=$env:PTBK_VERSION" "/DNumericVersion=$env:PTBK_NUMERIC_VERSION" installer\windows\promptbook.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
      - name: The bootstrap installs and reports the exact published ptbk version
        shell: powershell
        run: |
          # The version was published moments ago: an installation failure (exit 5) is retried while the registry propagates it.
          foreach ($attempt in 1..6) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -ProjectsRoot (Join-Path $env:RUNNER_TEMP 'Promptbook Release') -ProjectName 'first project' -AllowPtbkReplacement -NoLaunch
            if ($LASTEXITCODE -ne 5) { break }
            Start-Sleep -Seconds 20
          }
          if ($LASTEXITCODE -ne 0) { throw "bootstrap exited with $LASTEXITCODE" }
          # npm.cmd explicitly: plain `npm` may resolve to npm.ps1, which the execution policy can block.
          $reported = & (Join-Path (npm.cmd prefix --global).Trim() 'ptbk.cmd') --version
          if ($reported -notmatch [regex]::Escape($env:PTBK_VERSION)) { throw "installed ptbk reports $reported" }
      - name: Bootstrap diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA 'Promptbook\installer') -Filter 'bootstrap-*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name)"; Get-Content -LiteralPath $_.FullName }
      - name: Publish and verify the installer on the GitHub Release
        shell: pwsh
        run: node scripts/publish-windows-installer.mjs "dist-installer/Promptbook-Setup-$env:PTBK_VERSION-windows-x64.exe"
  vscode-extension:
    # Wait for installer release creation to avoid two jobs racing to create the same GitHub Release.
    # Still publish the extension if the installer failed, provided npm publication itself succeeded.
    if: ${{ always() && !cancelled() && github.repository == 'webgptorg/promptbook' && needs.publish.result == 'success' }}
    needs: [publish, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.VSCE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run package:vscode
      - name: Publish matching VSIX to GitHub Release and existing Marketplace listing
        run: npm run release:vscode
