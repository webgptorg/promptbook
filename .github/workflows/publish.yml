name: Publish ptbk
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match package.json)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-ptbk-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Validate release tag and package version
        run: npm run release:validate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Publish the single ptbk package
        run: npm run release:publish -- --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
