name: Publish ptbk
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match package.json)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-ptbk-publish
  cancel-in-progress: false
jobs:
  commit-check:
    # The release commit is pushed with its tag, so the branch push already runs check.yml on this exact commit.
    # Its passing run is reused. A failed one gets one re-run of its failed jobs; failing again, only its engine jobs
    # decide npm, VS Code and Android (`passed`), and the desktop installers need its desktop jobs too (`desktop`).
    # With no run, a cancelled or a hung one, `validate` checks the tag here (scripts/await-commit-check.mjs). A
    # desktop candidate whose compiled App is no longer App main is rebuilt by `validate` (`revalidate`).
    if: github.repository == 'webgptorg/promptbook'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
    outputs:
      passed: ${{ steps.candidate.outputs.passed }}
      desktop: ${{ steps.candidate.outputs.desktop }}
      revalidate: ${{ steps.candidate.outputs.revalidate }}
      run-id: ${{ steps.candidate.outputs.run-id }}
      app-sha: ${{ steps.app.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: await
        run: node scripts/await-commit-check.mjs "$(git rev-parse HEAD)"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Resolve the current App main for all release installers
        id: app
        env:
          GH_TOKEN: ${{ secrets.PROMPTBOOK_APP_READ_TOKEN }}
        # Without the secret the engine is still released; only the desktop installers, which bundle the App, are not.
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::Repository secret PROMPTBOOK_APP_READ_TOKEN is not set: the desktop installers of this release cannot be built."
          elif ! sha=$(gh api repos/webgptorg/app/commits/main --jq .sha); then
            echo "::warning::App main could not be resolved: the desktop installers of this release cannot be built."
          else
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse the engine check, and the desktop candidate only when its compiled App is still current
        id: candidate
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_SHA: ${{ steps.app.outputs.sha }}
          RUN_ID: ${{ steps.await.outputs.run-id }}
          PASSED: ${{ steps.await.outputs.passed }}
          DESKTOP: ${{ steps.await.outputs.desktop }}
        run: |
          if [[ "$PASSED" != true ]]; then exit 0; fi
          { echo 'passed=true'; echo "run-id=$RUN_ID"; } >> "$GITHUB_OUTPUT"
          if [[ "$DESKTOP" != true || -z "$APP_SHA" ]]; then exit 0; fi
          if gh run download "$RUN_ID" --name desktop-engine-ui --dir "$RUNNER_TEMP/ui" && [[ $(jq -r .commit "$RUNNER_TEMP/ui/bundle.json") == "$APP_SHA" ]]; then
            echo 'desktop=true' >> "$GITHUB_OUTPUT"
          else
            echo 'revalidate=true' >> "$GITHUB_OUTPUT"
          fi
  validate:
    needs: commit-check
    if: github.repository == 'webgptorg/promptbook' && (needs.commit-check.outputs.passed != 'true' || needs.commit-check.outputs.revalidate == 'true')
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      actions: read
    secrets:
      PROMPTBOOK_APP_READ_TOKEN: ${{ secrets.PROMPTBOOK_APP_READ_TOKEN }}
    with:
      app-ref: ${{ needs.commit-check.outputs.app-sha }}
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  computer-native:
    # The engine's npm package also owns native desktop control: end users must not need Xcode or Electron.
    # It only compiles, so it runs alongside the validation; nothing is published before that passes.
    if: github.repository == 'webgptorg/promptbook'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: arm64
      - name: Compile the engine-owned primary-desktop helper
        run: node scripts/build-computer-helper.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: computer-native-macos-arm64
          path: .ptbk/computer-native/macos-arm64/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    # `validate` is skipped when the branch check is reused: `!cancelled()` keeps a skipped need from skipping this job.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && needs.computer-native.result == 'success' && (needs.commit-check.outputs.passed == 'true' || needs.validate.result == 'success') }}
    needs: [commit-check, validate, computer-native]
    runs-on: ubuntu-latest
    # Covers npm's registry processing after the upload, which `release:publish` waits for (up to 35 minutes).
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PTBK_REQUIRE_NATIVE_HELPER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: computer-native-macos-arm64
          path: .ptbk/computer-native/macos-arm64/
      - run: npm ci
      - name: Validate release tag and package version
        run: npm run release:validate
      - name: Publish the single ptbk package
        run: npm run release:publish -- --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  windows-installer:
    # The matching Windows installer is an additional output of the same release; npm publication stays separate. A
    # missing, corrupt or mismatched installer makes the release incomplete (this job fails) without republishing npm.
    # check.yml already built and tested this installer from the exact release commit (desktop payload, Inno Setup,
    # compiled-installer runs): that validated candidate is published instead of being rebuilt here.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && needs.publish.result == 'success' && (needs.commit-check.outputs.desktop == 'true' || needs.validate.result == 'success') }}
    needs: [commit-check, validate, publish]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the release version
        shell: pwsh
        run: |
          node scripts/validate-release.mjs $env:RELEASE_TAG
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "PTBK_VERSION=$version" >> $env:GITHUB_ENV
      - name: Download the installer candidate validated for this commit
        uses: actions/download-artifact@v6
        with:
          name: windows-desktop-installer-candidate
          path: dist-installer
          run-id: ${{ needs.commit-check.outputs.desktop == 'true' && needs.commit-check.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The bootstrap installs and reports the exact published ptbk version
        shell: powershell
        run: |
          # The version was published moments ago: an installation failure (exit 5) is retried while the registry propagates it.
          foreach ($attempt in 1..6) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -SkipProject -AllowPtbkReplacement -NoLaunch
            if ($LASTEXITCODE -ne 5) { break }
            Start-Sleep -Seconds 20
          }
          if ($LASTEXITCODE -ne 2) { throw "bootstrap exited with $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          # npm.cmd explicitly: plain `npm` may resolve to npm.ps1, which the execution policy can block.
          $reported = & (Join-Path (npm.cmd prefix --global).Trim() 'ptbk.cmd') --version
          if ($reported -notmatch [regex]::Escape($env:PTBK_VERSION)) { throw "installed ptbk reports $reported" }
      - name: Bootstrap diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA 'Promptbook\installer') -Filter 'bootstrap-*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name)"; Get-Content -LiteralPath $_.FullName }
      - name: Publish and verify the installer on the GitHub Release
        shell: pwsh
        run: node scripts/publish-desktop-installer.mjs "dist-installer/Promptbook-Setup-$env:PTBK_VERSION-windows-x64.exe"
  macos-desktop:
    # Use exactly the UI that passed in the Windows installer candidate and both macOS smoke tests.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && needs.computer-native.result == 'success' && (needs.commit-check.outputs.desktop == 'true' || needs.validate.result == 'success') }}
    needs: [computer-native, commit-check, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # Read-only here: packaging matches check.yml's environment (electron-builder detects token-based publishers).
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm run release:validate
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: computer-native-macos-arm64
          path: .ptbk/computer-native/macos-arm64/
      - run: npm run build
        env:
          PTBK_BUILD_PROFILE: staging
      - uses: actions/download-artifact@v6
        with:
          name: desktop-engine-ui
          run-id: ${{ needs.commit-check.outputs.desktop == 'true' && needs.commit-check.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/desktop-engine-ui
      - run: npm ci --prefix apps/desktop
      - name: Package the matching macOS application
        run: npm --prefix apps/desktop run package:macos -- --release
        env:
          PTBK_DESKTOP_UI_BUNDLE: ${{ runner.temp }}/desktop-engine-ui
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify the downloadable DMG
        run: |
          dmg=(apps/desktop/release/Promptbook-*-macos-${{ matrix.arch }}*.dmg)
          bash apps/desktop/test/macos-dmg.sh "${dmg[0]}"
          mkdir -p "$RUNNER_TEMP/dmg" && cp "${dmg[0]}" "$RUNNER_TEMP/dmg/"
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release-dmg-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
  macos-desktop-release:
    # Publishes the DMGs verified by `macos-desktop` once the release commit is validated; no macOS runner needed. One
    # architecture failing, or cancelled because GitHub found no macOS arm64 runner (0.119.0-122), still publishes the
    # other, and this job then fails so the incomplete release is visible.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && contains(fromJSON('["success", "failure", "cancelled"]'), needs.macos-desktop.result) && (needs.commit-check.outputs.desktop == 'true' || needs.validate.result == 'success') }}
    needs: [commit-check, validate, macos-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          pattern: macos-release-dmg-*
          path: dist-dmg
          merge-multiple: true
      - name: Publish the downloadable DMGs and checksums
        run: |
          shopt -s nullglob
          dmgs=(dist-dmg/*.dmg)
          for dmg in "${dmgs[@]}"; do node scripts/publish-desktop-installer.mjs "$dmg"; done
          if [[ ${#dmgs[@]} -ne 2 ]]; then echo "::error::Expected the arm64 and x64 DMGs, got ${#dmgs[@]}."; exit 1; fi
  android-apk:
    # Android embeds the exact tagged engine and shares the existing release asset publisher.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && (needs.commit-check.outputs.passed == 'true' || needs.validate.result == 'success') }}
    needs: [commit-check, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: npm run release:validate
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: npm ci
      - name: Build and publish the matching signed APK and checksum
        env:
          PTBK_ANDROID_KEYSTORE_BASE64: ${{ secrets.PTBK_ANDROID_KEYSTORE_BASE64 }}
          PTBK_ANDROID_STORE_PASSWORD: ${{ secrets.PTBK_ANDROID_STORE_PASSWORD }}
          PTBK_ANDROID_KEY_ALIAS: ${{ secrets.PTBK_ANDROID_KEY_ALIAS }}
          PTBK_ANDROID_KEY_PASSWORD: ${{ secrets.PTBK_ANDROID_KEY_PASSWORD }}
        run: |
          version=$(node -p 'require("./package.json").version')
          suffix=
          if [[ -z "$PTBK_ANDROID_KEYSTORE_BASE64" ]]; then suffix=-preview; fi
          apk="$RUNNER_TEMP/Promptbook-$version-android-arm64$suffix.apk"
          # Reuse a previously uploaded APK on retries, including its original signing identity.
          if gh release download "$RELEASE_TAG" --pattern "${apk##*/}" --output "$apk"; then
            bash apps/android/verify-apk.sh "$apk"
          else
            bash apps/android/build-apk.sh "$apk"
          fi
          node scripts/publish-desktop-installer.mjs "$apk"
  vscode-extension:
    # The extension is built from source and needs neither npm nor the installer.
    # Both asset publishers tolerate concurrent creation of the matching GitHub Release.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && (needs.commit-check.outputs.passed == 'true' || needs.validate.result == 'success') }}
    needs: [commit-check, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run package:vscode
      - name: Publish matching VSIX to GitHub Release and existing Marketplace listing
        run: npm run release:vscode
  desktop-withheld:
    # The engine was released from a check run whose desktop jobs failed (for example without the
    # PROMPTBOOK_APP_READ_TOKEN secret): the desktop installers are skipped, and this job fails so that the
    # incomplete release stays visible. Once fixed, `gh workflow run publish.yml -f tag=<tag>` adds them;
    # every publisher of this workflow is idempotent.
    if: ${{ !cancelled() && github.repository == 'webgptorg/promptbook' && needs.commit-check.outputs.passed == 'true' && needs.commit-check.outputs.desktop != 'true' && needs.commit-check.outputs.revalidate != 'true' }}
    needs: commit-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::The desktop installers of this release were not built: the desktop jobs of check run ${{ needs.commit-check.outputs.run-id }} failed or App main could not be resolved. npm, VS Code and Android are released."
          exit 1
