name: Publish ptbk
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must match package.json)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-ptbk-publish
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'webgptorg/promptbook'
    uses: ./.github/workflows/check.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  computer-native:
    # The engine's npm package also owns native desktop control: end users must not need Xcode or Electron.
    if: github.repository == 'webgptorg/promptbook'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: arm64
      - name: Compile the engine-owned primary-desktop helper
        run: node scripts/build-computer-helper.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: computer-native-macos-arm64
          path: .ptbk/computer-native/macos-arm64/
          include-hidden-files: true
          if-no-files-found: error
  publish:
    if: github.repository == 'webgptorg/promptbook'
    needs: [validate, computer-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PTBK_REQUIRE_NATIVE_HELPER: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: computer-native-macos-arm64
          path: .ptbk/computer-native/macos-arm64/
      - run: npm ci
      - name: Validate release tag and package version
        run: npm run release:validate
      - name: Publish the single ptbk package
        run: npm run release:publish -- --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  windows-installer:
    # The matching Windows installer is an additional output of the same release; npm publication stays separate. A
    # missing, corrupt or mismatched installer makes the release incomplete (this job fails) without republishing npm.
    if: github.repository == 'webgptorg/promptbook'
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the release version
        shell: pwsh
        run: |
          node scripts/validate-release.mjs $env:RELEASE_TAG
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $numeric = ($version -replace '-.*$', '') + '.' + (($version -replace '^[^-]*-?', '') -replace '\D', '' | ForEach-Object { if ($_) { $_ } else { '0' } })
          "PTBK_VERSION=$version" >> $env:GITHUB_ENV
          "PTBK_NUMERIC_VERSION=$numeric" >> $env:GITHUB_ENV
      - name: Build the matching optional desktop payload
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependency installation failed" }
          npm --prefix apps/desktop test
          if ($LASTEXITCODE -ne 0) { throw "Desktop controller tests failed" }
          npm --prefix apps/desktop run package:windows
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed" }
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging exited with $LASTEXITCODE" }
      - name: Build the installer from the release tag
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'The Inno Setup compiler (ISCC.exe) was not found after its installation.' }
          & ./installer/windows/prepare-artwork.ps1
          & $iscc.FullName "/DVersion=$env:PTBK_VERSION" "/DNumericVersion=$env:PTBK_NUMERIC_VERSION" installer\windows\promptbook.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
      - name: The bootstrap installs and reports the exact published ptbk version
        shell: powershell
        run: |
          # The version was published moments ago: an installation failure (exit 5) is retried while the registry propagates it.
          foreach ($attempt in 1..6) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -SkipProject -AllowPtbkReplacement -NoLaunch
            if ($LASTEXITCODE -ne 5) { break }
            Start-Sleep -Seconds 20
          }
          if ($LASTEXITCODE -ne 2) { throw "bootstrap exited with $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          # npm.cmd explicitly: plain `npm` may resolve to npm.ps1, which the execution policy can block.
          $reported = & (Join-Path (npm.cmd prefix --global).Trim() 'ptbk.cmd') --version
          if ($reported -notmatch [regex]::Escape($env:PTBK_VERSION)) { throw "installed ptbk reports $reported" }
      - name: Bootstrap diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA 'Promptbook\installer') -Filter 'bootstrap-*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name)"; Get-Content -LiteralPath $_.FullName }
      - name: Publish and verify the installer on the GitHub Release
        shell: pwsh
        run: node scripts/publish-desktop-installer.mjs "dist-installer/Promptbook-Setup-$env:PTBK_VERSION-windows-x64.exe"
  macos-desktop:
    # The DMG embeds the exact tagged engine, so building it does not wait for registry propagation.
    if: github.repository == 'webgptorg/promptbook'
    needs: [validate, computer-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm run release:validate
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: computer-native-macos-arm64
          path: .ptbk/computer-native/macos-arm64/
      - run: npm run build
      - run: npm ci --prefix apps/desktop
      - name: Package the matching macOS application
        run: npm --prefix apps/desktop run package:macos -- --release
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify and publish the downloadable DMG and checksum
        run: |
          dmg=(apps/desktop/release/Promptbook-*-macos-${{ matrix.arch }}*.dmg)
          bash apps/desktop/test/macos-dmg.sh "${dmg[0]}"
          node scripts/publish-desktop-installer.mjs "${dmg[0]}"
  android-apk:
    # Android embeds the exact tagged engine and shares the existing release asset publisher.
    if: github.repository == 'webgptorg/promptbook'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: npm run release:validate
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: npm ci
      - name: Build and publish the matching signed APK and checksum
        env:
          PTBK_ANDROID_KEYSTORE_BASE64: ${{ secrets.PTBK_ANDROID_KEYSTORE_BASE64 }}
          PTBK_ANDROID_STORE_PASSWORD: ${{ secrets.PTBK_ANDROID_STORE_PASSWORD }}
          PTBK_ANDROID_KEY_ALIAS: ${{ secrets.PTBK_ANDROID_KEY_ALIAS }}
          PTBK_ANDROID_KEY_PASSWORD: ${{ secrets.PTBK_ANDROID_KEY_PASSWORD }}
        run: |
          version=$(node -p 'require("./package.json").version')
          suffix=
          if [[ -z "$PTBK_ANDROID_KEYSTORE_BASE64" ]]; then suffix=-preview; fi
          apk="$RUNNER_TEMP/Promptbook-$version-android-arm64$suffix.apk"
          # Reuse a previously uploaded APK on retries, including its original signing identity.
          if gh release download "$RELEASE_TAG" --pattern "${apk##*/}" --output "$apk"; then
            bash apps/android/verify-apk.sh "$apk"
          else
            bash apps/android/build-apk.sh "$apk"
          fi
          node scripts/publish-desktop-installer.mjs "$apk"
  vscode-extension:
    # The extension is built from source and needs neither npm nor the installer.
    # Both asset publishers tolerate concurrent creation of the matching GitHub Release.
    if: github.repository == 'webgptorg/promptbook'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run package:vscode
      - name: Publish matching VSIX to GitHub Release and existing Marketplace listing
        run: npm run release:vscode
