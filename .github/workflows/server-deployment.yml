name: Server deployment

on:
  pull_request:
    paths: ['deploy/**', 'test/server-deployment.test.mjs', 'test/fixtures/vps-handoff.py', '.github/workflows/server-deployment.yml']
  push:
    branches: ['reborn/2026-10']
    paths: ['deploy/**', 'test/server-deployment.test.mjs', 'test/fixtures/vps-handoff.py', '.github/workflows/server-deployment.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check template and safe installer paths
        run: node --test test/server-deployment.test.mjs
      - name: Prepare the server unattended, like a provider startup script
        run: |
          sudo bash deploy/ubuntu/install.sh --prepare-only | tee prepare.log
          grep -q 'Server prepared; initialization pending' prepare.log
          sudo test -d /var/lib/promptbook/projects/my-agenda
          sudo test ! -e /var/lib/promptbook/PTBK
      - name: Retry and the default command reuse the installation and preserve user data
        run: |
          sudo -iu promptbook touch /var/lib/promptbook/keep-me
          test "$(sudo -iu promptbook git config --global user.email)" = promptbook@localhost
          sudo -iu promptbook git config --global user.name 'Deployment smoke owner'
          version=$(cat /opt/promptbook/installed-version)
          sudo bash deploy/ubuntu/install.sh --version "$version" --prepare-only
          sudo bash deploy/ubuntu/install.sh | grep "Reusing the installed engine $version"
          sudo test -f /var/lib/promptbook/keep-me
          test "$(sudo -iu promptbook git config --global user.name)" = 'Deployment smoke owner'
      - name: An init handoff without a terminal stops incomplete
        run: |
          set +e
          sudo bash deploy/ubuntu/install.sh --init </dev/null >handoff.log 2>&1
          code=$?
          set -e
          cat handoff.log
          test "$code" = 3
          grep -q 'initialization pending' handoff.log
          grep -qF 'curl -fsSL https://www.ptbk.io/install.sh | bash' handoff.log
          sudo test ! -e /var/lib/promptbook/PTBK
      - name: The bootstrap hands its live terminal to init as the engine user
        run: |
          python3 test/fixtures/vps-handoff.py sudo bash deploy/ubuntu/install.sh --init --path PTBK/project/attended -- --intent 'Deployment smoke agenda' --installation global --no-harness --browser-profile isolated --browser-mode headless --no-commit-traces --ignore-trace-videos --no-record-video --no-auto-sync --no-start
          test "$(sudo stat -c %U /var/lib/promptbook/PTBK/project/attended/ptbk.json)" = promptbook
          sudo grep -q 'Deployment smoke agenda' /var/lib/promptbook/PTBK/project/attended/specs/_initial.md
          ! sudo grep -q 'Deployment smoke agenda' /var/log/promptbook-install.log
      - name: Noninteractive handoff, boot registration and deliberate stop
        run: |
          sudo bash deploy/ubuntu/install.sh --init --path projects/my-agenda -- --non-interactive --installation global --no-harness --browser-profile isolated --browser-mode headless --no-dashboard --raw
          sudo -iu promptbook bash -s <<'SMOKE'
            set -euxo pipefail
            test -w "$HOME/.local/share"
            cd ~/projects/my-agenda
            test "$(stat -c %U ptbk.json)" = promptbook
            env XDG_CONFIG_HOME=/root/foreign-config XDG_DATA_HOME=/root/foreign-data XDG_CACHE_HOME=/root/foreign-cache ptbk status --raw
            test -n "$(find ~/.config/systemd/user -name "ptbk-agenda-*.service" -print -quit)"
            test "$(loginctl show-user promptbook --property=Linger --value)" = yes
            ptbk stop --raw
            ptbk start --resume-service --non-interactive --raw | grep "stopped intentionally"
          SMOKE
