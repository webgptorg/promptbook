name: Server deployment

on:
  pull_request:
    paths: ['deploy/**', 'test/server-deployment.test.mjs', '.github/workflows/server-deployment.yml']
  push:
    branches: ['reborn/2026-10']
    paths: ['deploy/**', 'test/server-deployment.test.mjs', '.github/workflows/server-deployment.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check template and safe installer paths
        run: node --test test/server-deployment.test.mjs
      - name: Install actual published engine and server prerequisites
        run: sudo bash deploy/ubuntu/install.sh
      - name: Verify retry preserves user data
        run: |
          sudo -iu promptbook touch /var/lib/promptbook/projects/keep-me
          version=$(cat /opt/promptbook/installed-version)
          sudo bash deploy/ubuntu/install.sh "$version"
          sudo test -f /var/lib/promptbook/projects/keep-me
      - name: Initialize without AI access, check boot registration and deliberate stop
        run: |
          sudo -iu promptbook bash -lc '
            set -euo pipefail
            cd ~/projects/my-agenda
            ptbk init --path "$PWD" --non-interactive --installation global --no-harness --browser-profile isolated --browser-mode headless --no-dashboard --raw
            ptbk status --raw
            test -n "$(find ~/.config/systemd/user -name "ptbk-agenda-*.service" -print -quit)"
            test "$(loginctl show-user promptbook --property=Linger --value)" = yes
            ptbk stop --raw
            ptbk start --resume-service --non-interactive --raw | grep "stopped intentionally"
          '
