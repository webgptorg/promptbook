name: Check ptbk
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to check
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Compile the actual engine-owned macOS helper
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: node scripts/build-computer-helper.mjs
      - name: Validate Android native dependency selection
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s apps/android/test -p 'test_*.py'
      - run: npm run check:full
  native-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Real browser startup, full interaction, shared pools, Wallet codes and device approval
        run: npm run test:browser
  macos-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop test
      - run: npm --prefix apps/desktop run package:macos
        env:
          # Match the release environment, including electron-builder's token-based publisher detection.
          GH_TOKEN: ${{ github.token }}
      - name: Verify the DMG and run the packaged application
        run: bash apps/desktop/test/macos-dmg.sh apps/desktop/release/Promptbook-*-macos-${{ matrix.arch }}-unsigned.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: macos-desktop-candidate-${{ matrix.arch }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:vscode
      - run: npm run test:vscode
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v6
        with:
          name: book-extension
          path: |
            dist-vscode/*.vsix
            dist-vscode/*.sha256
          if-no-files-found: error
  windows-installer-regressions:
    # Run the focused regressions early, including the real native dialog and Unicode Windows clipboard.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Windows PowerShell 5.1 and PowerShell 7 folder and report regressions
        run: node --test test/installer.test.mjs
      - name: Compile the actual report dialog and test native copy, folder choice and retry
        if: always()
        shell: powershell
        run: |
          choco install innosetup --no-progress -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'The Inno Setup compiler was not found.' }
          & $iscc.FullName test\fixtures\installer-dialog.iss
          if ($LASTEXITCODE -ne 0) { throw "Report fixture compilation exited with $LASTEXITCODE" }
          $work = Join-Path $env:RUNNER_TEMP ('Installer Report ' + [char]0x00FC + ' [x] & co')
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\fixtures\installer-dialog.ps1 -Executable (Resolve-Path dist-installer-test\report-dialog-fixture.exe).Path -Bootstrap (Resolve-Path installer\windows\bootstrap.ps1).Path -WorkDirectory $work
          if ($LASTEXITCODE -ne 0) { throw "Native installer report fixture exited with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-installer-report-evidence
          path: ${{ runner.temp }}/Installer Report *
          if-no-files-found: warn
  windows-installer:
    # The Windows installer's bootstrap is validated on every check: script syntax, prerequisite detection with an
    # isolated PATH (no Node.js/npm/Git visible: everything planned, nothing installed), and a real run with the
    # runner's compatible tools that installs the exact package candidate and prepares the init handoff.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Pack the exact package candidate
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          npm pack --silent | Out-Null
          "PTBK_VERSION=$version" >> $env:GITHUB_ENV
          "PTBK_TARBALL=$((Resolve-Path "ptbk-$version.tgz").Path)" >> $env:GITHUB_ENV
      - name: Build and test the optional desktop package, including native Windows PTYs
        shell: pwsh
        run: |
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "Desktop dependency installation failed" }
          npm --prefix apps/desktop test
          if ($LASTEXITCODE -ne 0) { throw "Desktop controller tests failed" }
          node --test test/desktop-prompts.test.mjs test/terminal-prompts.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Shared prompt tests failed" }
          npm --prefix apps/desktop run package:windows
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed" }
          $env:PTBK_DESKTOP_EXECUTABLE = (Resolve-Path 'apps/desktop/release/win-unpacked/promptbook.exe').Path
          npm --prefix apps/desktop run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "Desktop end-to-end checks exited with $LASTEXITCODE" }
      - name: Missing prerequisites are detected and planned (isolated PATH, nothing installed)
        shell: powershell
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $output = & .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -ProjectsRoot (Join-Path $env:RUNNER_TEMP 'Plan Projects') -ProjectName 'first project' -Plan -IsolatedPath 6>&1 | Out-String
          Write-Output $output
          if ($output -notmatch 'PLAN: prepare a verified per-user Node.js') { throw 'missing Node.js was not detected' }
          if ($output -notmatch 'PLAN: Git is missing') { throw 'missing Git was not detected' }
      - name: A clean user can download, verify and reuse the private Node.js runtime
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP ('Promptbook Clean Runtime ' + [char]0x00FC + ' [x] & co')
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\test\fixtures\installer-functions.ps1 -Bootstrap (Resolve-Path .\installer\windows\bootstrap.ps1).Path -WorkDirectory $work -Mode live-node
          if ($LASTEXITCODE -ne 0) { throw "Clean Node.js runtime preparation exited with $LASTEXITCODE" }
      - name: Compatible prerequisites are reused; the candidate installs and the handoff is prepared (spaces, Unicode, special characters)
        shell: powershell
        run: |
          # Unicode is built at run time: the step script itself stays ASCII for Windows PowerShell 5.1.
          $root = Join-Path $env:RUNNER_TEMP ('Promptbook Projekty ' + [char]0x00FC + ' & co')
          powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -PackageSpec $env:PTBK_TARBALL -ProjectsRoot $root -ProjectName "first & project's" -AllowPtbkReplacement -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "bootstrap exited with $LASTEXITCODE" }
          $target = Join-Path $root "first & project's"
          if (-not (Test-Path -LiteralPath $target)) { throw 'the first-project folder was not created' }
          if (Test-Path -LiteralPath (Join-Path $root '.git')) { throw 'the projects folder must not become a repository' }
          # Repeating reuses everything and still refuses nothing for the empty folder.
          powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -PackageSpec $env:PTBK_TARBALL -ProjectsRoot $root -ProjectName "first & project's" -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "repeated bootstrap exited with $LASTEXITCODE" }
          # A nonempty folder is preserved and refused (exit 4), never initialized as a new project.
          Set-Content -LiteralPath (Join-Path $target 'keep.txt') -Value 'user file'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -PackageSpec $env:PTBK_TARBALL -ProjectsRoot $root -ProjectName "first & project's" -NoLaunch
          if ($LASTEXITCODE -ne 4) { throw "a nonempty folder must be refused with exit 4 (got $LASTEXITCODE)" }
          if ((Get-Content -LiteralPath (Join-Path $target 'keep.txt')) -ne 'user file') { throw 'user content changed' }
          # The runner ends every PowerShell step with `exit $LASTEXITCODE`: the expected refusal must not fail the step.
          $global:LASTEXITCODE = 0
      - name: Defaults preserve legacy files and reserve npm launchers before real candidate installation
        shell: powershell
        run: |
          $originalHome = $env:USERPROFILE
          $originalPrefix = $env:NPM_CONFIG_PREFIX
          try {
            foreach ($kind in @('legacy', 'future-launcher')) {
              $work = Join-Path $env:RUNNER_TEMP ('Default Root ' + $kind + ' ' + [char]0x00FC + ' [x] & co')
              $env:USERPROFILE = Join-Path $work 'home'
              [IO.Directory]::CreateDirectory($env:USERPROFILE) | Out-Null
              $occupied = Join-Path $env:USERPROFILE 'ptbk'
              if ($kind -eq 'legacy') {
                [IO.File]::WriteAllText($occupied, 'legacy user file')
                $env:NPM_CONFIG_PREFIX = Join-Path $work 'npm'
              } else {
                $env:NPM_CONFIG_PREFIX = $env:USERPROFILE
              }
              $result = Join-Path $work 'result.ini'
              foreach ($attempt in 1..2) {
                powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -PackageSpec $env:PTBK_TARBALL -NoLaunch -ResultFile $result
                if ($LASTEXITCODE -ne 0) { throw "Default bootstrap $kind exited with $LASTEXITCODE" }
                $target = Join-Path $env:USERPROFILE 'ptbk-projects\my-first-project'
                if (-not (Test-Path -LiteralPath $target -PathType Container)) { throw 'The safe default project was not prepared.' }
                if (Get-ChildItem -LiteralPath $target -Force) { throw 'The prepared project must remain empty.' }
                if (-not [IO.File]::Exists($occupied)) { throw 'The existing or future npm launcher path must remain a file.' }
                if ($kind -eq 'legacy' -and [IO.File]::ReadAllText($occupied) -ne 'legacy user file') { throw 'The legacy file was replaced.' }
              }
              $hash = (Get-FileHash -LiteralPath $occupied).Hash
              powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\installer\windows\bootstrap.ps1 -PromptbookVersion $env:PTBK_VERSION -ProjectsRoot (Join-Path $env:USERPROFILE 'ptbk\project') -NoLaunch
              if ($LASTEXITCODE -ne 4) { throw 'An explicitly selected blocked root must fail instead of moving elsewhere.' }
              if ((Get-FileHash -LiteralPath $occupied).Hash -ne $hash) { throw 'Explicit-path validation changed the occupied file.' }
              $global:LASTEXITCODE = 0
            }
          } finally {
            $env:USERPROFILE = $originalHome
            $env:NPM_CONFIG_PREFIX = $originalPrefix
          }
      - name: The handed-off command initializes the prepared folder (non-interactive substitute of the terminal)
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP ('Promptbook Handoff ' + [char]0x00FC + '\first project')
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          git config --global user.name 'Fixture Tester'
          git config --global user.email 'fixture@example.test'
          # npm.cmd explicitly: plain `npm` may resolve to npm.ps1, which the execution policy can block.
          $ptbk = Join-Path (npm.cmd prefix --global).Trim() 'ptbk.cmd'
          & $ptbk init --path $target --non-interactive --installation global --no-harness --no-start --raw
          if ($LASTEXITCODE -notin 0, 3) { throw "ptbk init exited with $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $target 'ptbk.json'))) { throw 'init did not configure the handed-off folder' }
          # The runner ends every PowerShell step with `exit $LASTEXITCODE`: an accepted exit 3 must not fail the step.
          $global:LASTEXITCODE = 0
      - name: Bootstrap diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA 'Promptbook\installer') -Filter 'bootstrap-*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name)"; Get-Content -LiteralPath $_.FullName }
      - name: Inno Setup script compiles
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $numeric = ($env:PTBK_VERSION -replace '-.*$', '') + '.' + (($env:PTBK_VERSION -replace '^[^-]*-?', '') -replace '\D', '' | ForEach-Object { if ($_) { $_ } else { '0' } })
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'The Inno Setup compiler (ISCC.exe) was not found after its installation.' }
          & ./installer/windows/prepare-artwork.ps1
          & $iscc.FullName "/DVersion=$env:PTBK_VERSION" "/DNumericVersion=$numeric" installer\windows\promptbook.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
      - name: Run the compiled installer twice without creating or modifying project folders
        shell: powershell
        run: |
          $installer = (Resolve-Path "dist-installer/Promptbook-Setup-$env:PTBK_VERSION-windows-x64.exe").Path
          $work = Join-Path $env:RUNNER_TEMP ('Compiled Installer ' + [char]0x00FC + ' [x] & co')
          [IO.Directory]::CreateDirectory($work) | Out-Null
          $originalHome = $env:USERPROFILE
          try {
            $env:USERPROFILE = Join-Path $work 'fixture home'
            [IO.Directory]::CreateDirectory($env:USERPROFILE) | Out-Null
            $legacy = Join-Path $env:USERPROFILE 'ptbk'
            [IO.File]::WriteAllText($legacy, 'user file preserved')
            $project = Join-Path $work 'should not be created'
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/COMPONENTS=core', '/PrepareOnly=yes', ('/ProjectsRoot="' + $project + '"'), '/ProjectName="first project"', ('/LOG="' + $work + '.log"'))
            foreach ($attempt in 1..2) {
              $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) { Get-Content -LiteralPath ($work + '.log'); throw "Compiled installer exited with $($process.ExitCode)" }
              if (Test-Path -LiteralPath $project) { throw 'The installer used a removed project argument.' }
              if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE 'ptbk-projects')) { throw 'The installer created a fallback projects folder.' }
              if ([IO.File]::ReadAllText($legacy) -ne 'user file preserved') { throw 'The installer changed an existing user file.' }
            }
          } finally { $env:USERPROFILE = $originalHome }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-desktop-installer-candidate
          path: dist-installer/*.exe
          if-no-files-found: error
