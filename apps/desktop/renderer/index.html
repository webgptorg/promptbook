<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Promptbook</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script src="vendor/app.js" defer></script>
</head>
<body>
  <header>
    <picture><source media="(prefers-color-scheme: dark)" srcset="vendor/readme-wordmark-dark.svg"><img src="vendor/readme-wordmark.svg" width="148" alt="Promptbook"></picture>
    <button id="back" hidden>Local projects</button>
  </header>
  <div id="desktop-update" role="status" hidden></div>
  <div id="notice" role="status" hidden></div>
  <main id="overview-pane">
    <h1>Local projects</h1>
    <nav id="projects" aria-label="Local projects"></nav>
    <div class="toolbar"><button id="new-project" class="primary">New project</button><button id="console">Open CLI console</button></div>
  </main>
  <section id="terminal-pane" hidden aria-label="CLI console">
    <div id="terminal-tabs" role="tablist" aria-label="CLI terminals"></div>
    <section id="prompt-pane" hidden aria-label="Project initialization"></section>
    <div id="terminal-host"></div>
  </section>
</body>
</html>
