<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Promptbook</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script src="vendor/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="vendor/readme-wordmark-dark.svg">
        <img src="vendor/readme-wordmark.svg" width="168" height="36" alt="Promptbook">
      </picture>
      <small>Local</small>
    </div>
    <div id="heading">Your projects</div>
    <div id="appearance" class="appearance" role="group" aria-label="Theme">
      <button type="button" data-theme="system" aria-label="System" title="System theme" aria-pressed="true" disabled>
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="10.5" rx="2"/><path d="M10 14v3m-3.5 0h7"/></svg>
      </button>
      <button type="button" data-theme="light" aria-label="Light" title="Light theme" aria-pressed="false" disabled>
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.35 4.35l1.4 1.4m8.5 8.5 1.4 1.4m0-11.3-1.4 1.4m-8.5 8.5-1.4 1.4"/></svg>
      </button>
      <button type="button" data-theme="dark" aria-label="Dark" title="Dark theme" aria-pressed="false" disabled>
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.6 12a7.7 7.7 0 0 1-9.6-9.6A7.8 7.8 0 1 0 17.6 12Z"/></svg>
      </button>
    </div>
    <button id="new-window">New window</button>
    <button id="cli">Open in terminal</button>
  </header>
  <aside id="project-sidebar">
    <button id="overview" class="wide">All projects</button>
    <div class="section-label">Projects</div>
    <nav id="projects" aria-label="Known projects"></nav>
    <button id="new-project" class="wide primary">+ New project</button>
    <button id="global-cli" class="wide">CLI global dashboard</button>
    <footer><span id="version">ptbk</span><br>Closing a window leaves your engines running.</footer>
  </aside>
  <div id="sidebar-divider" class="pane-divider" role="separator" aria-label="Projects sidebar width" aria-orientation="vertical" aria-controls="project-sidebar" tabindex="0"></div>
  <main>
    <div id="notice" role="status" hidden></div>
    <div id="workspace">
      <section id="overview-pane"></section>
      <section id="dashboard-pane" hidden aria-label="Project dashboard"><p class="empty">Connecting to the local project dashboard…</p></section>
      <section id="terminal-pane" hidden>
        <div id="terminal-tabs" role="tablist" aria-label="CLI terminals"></div>
        <section id="prompt-pane" hidden aria-label="Project initialization"></section>
        <div id="prompt-divider" class="pane-divider" role="separator" aria-label="Project setup panel height" aria-orientation="horizontal" aria-controls="prompt-pane" tabindex="0" hidden></div>
        <div id="terminal-host"></div>
      </section>
    </div>
  </main>
</body>
</html>
